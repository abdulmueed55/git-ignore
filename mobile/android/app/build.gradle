plugins {
    id 'com.android.application'
}

android {
    namespace 'pk.edu.fglacollege.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pk.edu.fglacollege.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // Default server; the user can change it on the start screen ("Server" link).
        buildConfigField 'String', 'SERVER_URL', "\"${project.findProperty('serverUrl') ?: 'https://fgla-erp-demo.onrender.com'}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign with the college's own key for Play Store / updates (see mobile/README.md).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
